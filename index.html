<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day by Grace App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
</head>
<body class="bg-white text-stone-700 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#BD6221] flex items-center justify-between px-4 py-4 shadow text-[#FDEFCC]">
    <div class="flex items-center space-x-4">
      <button onclick="toggleNav()" class="text-[#FDEFCC] text-2xl">&#9776;</button>
      <h1 class="text-xl font-bold whitespace-nowrap overflow-hidden text-ellipsis">Bible Reading Tracker</h1>
    </div>
    <img src="day-by-grace-logo-horizontal3.png" alt="Day by Grace Logo" class="h-10 max-h-12 ml-auto" />
  </header>

  <!-- SideNav -->
  <div id="sideNav" class="fixed left-0 top-16 w-60 bg-[#BD6221] text-[#FDEFCC] transform -translate-x-full transition-transform z-50 h-screen">
    <ul class="space-y-3 px-4 py-4">
      <li><a href="#" onclick="navigate('bible')" class="hover:underline">📖 Bible Tracker</a></li>
      <li><a href="#" onclick="navigate('events')" class="hover:underline">📅 Events</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <main class="flex flex-1 overflow-hidden">
    <div id="bibleTracker" class="w-60 bg-[#FDEFCC] p-3 overflow-y-auto"></div>
    <div id="chapterPanel" class="flex-1 p-4 overflow-y-auto"></div>
    <div id="calendarPanel" class="flex-1 p-4 overflow-y-auto hidden"></div>
  </main>

  <footer class="text-center text-sm text-[#777060] py-4">© 2025 Day by Grace</footer>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
  <script src="main.js" defer></script>
</body>
</html>
