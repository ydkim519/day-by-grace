<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Reading Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-stone-700 font-[system-ui,sf-pro-text,-apple-system,BlinkMacSystemFont,sans-serif] min-h-screen flex flex-col">

  <header class="bg-[#BD6221] flex items-center justify-between px-6 py-5 shadow text-[#FDEFCC]">
    <img src="day-by-grace-logo-horizontal3.png"
     alt="Day by Grace Logo Header"
     class="h-12 max-h-14" />
    <h1 class="text-xl font-bold tracking-wide">Bible Reading Tracker</h1>
  </header>

  <main class="p-4 max-w-3xl mx-auto flex-grow">
    <div id="bibleTracker" class="space-y-6"></div>
  </main>

  <footer class="text-center text-sm text-[#777060] mt-10 py-4">
    © 2024 Day by Grace
  </footer>

  <script src="main.js" defer></script>
</body>
</html>
