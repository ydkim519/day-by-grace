
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day by Grace – Bible Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="main.js" defer></script>
</head>
<body class="bg-orange-50 text-gray-800 font-sans min-h-screen">
  <header class="bg-rose-200 p-4 text-center text-2xl font-bold shadow-md">
    Day by Grace – Bible Tracker
  </header>
  <main class="p-4 space-y-4">
    <h2 class="text-xl font-semibold">📖 Select a Reading Plan</h2>
    <select id="planSelect" class="w-full p-2 border border-gray-300 rounded">
      <option value="Genesis 1">Genesis 1</option>
      <option value="John 1">John 1</option>
      <option value="Psalm 23">Psalm 23</option>
    </select>

    <button onclick="markAsRead()" class="bg-rose-400 text-white px-4 py-2 rounded shadow">
      Mark as Read
    </button>

    <h3 class="text-lg mt-6 font-medium">✅ Completed Readings</h3>
    <ul id="completedList" class="list-disc pl-5 text-gray-700"></ul>
  </main>
</body>
</html>
