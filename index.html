<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Reading Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-stone-700 font-[system-ui,sf-pro-text,-apple-system,BlinkMacSystemFont,sans-serif] min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#BD6221] flex items-center justify-between px-4 py-4 shadow text-[#FDEFCC]">
    <div class="flex items-center space-x-4">
      <h1 class="text-xl font-bold tracking-wide">Bible Reading Tracker</h1>
    </div>
    <!-- Swap logos based on screen -->
    <img src="day-by-grace-logo-horizontal3.png" alt="Day by Grace Logo Desktop" class="h-10 max-h-12 hidden sm:block" />
    <img src="day-by-grace-logo.png" alt="Day by Grace Logo Mobile" class="h-10 max-h-12 block sm:hidden" />
  </header>

  <!-- Main -->
  <main class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <div id="bibleTracker" class="w-60 bg-[#FDEFCC] p-3 overflow-y-auto flex-shrink-0"></div>
    <!-- Chapter panel -->
    <div id="chapterPanel" class="flex-1 p-4 overflow-y-auto"></div>
  </main>

  <footer class="text-center text-sm text-[#777060] mt-4 py-4">
    © 2025 Day by Grace
  </footer>

  <script src="main.js" defer></script>
</body>
</html>
